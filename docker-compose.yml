services:
  task-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neumorphic-task-manager
    ports:
      - "8000:8000"
    volumes:
      - task_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/tasks.db
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  task_data:
    driver: local
